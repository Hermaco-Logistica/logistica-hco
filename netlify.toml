[[redirects]]
  from = "/api/tracking-status"
  to = "/.netlify/functions/tracking-status"
  status = 200

[[redirects]]
  from = "/api/send-quotation"
  to = "/.netlify/functions/send-quotation"
  status = 200

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[dev]
  command = "npm run dev:vite"
  targetPort = 5173
  port = 8888

[build.environment]
  SECRETS_SCAN_OMIT_KEYS = "DHL_TRACKING_API_URL,DSV_OAUTH_URL,DSV_TRACKING_URL"